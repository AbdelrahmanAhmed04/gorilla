<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Gorilla</title>
    <meta name="description" content="Gorilla is a creative production company based in Cairo and Riyadh, delivering bold cinematic storytelling and high-end production services across the Middle East." />
    <meta name="keywords" content="Gorilla, production company, creative production, cinematic, Cairo, Riyadh, brand films, commercial production" />
    <meta name="author" content="Gorilla" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Theme / mobile -->
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Facebook, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gorilla — Creative Production Company" />
    <meta property="og:description" content="Bold, cinematic storytelling and high-end production services from Cairo & Riyadh. See our work and get in touch." />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="/src/assets/red-gorilla.png" />
    <meta property="og:image:alt" content="Gorilla logo — red gorilla" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gorilla — Creative Production Company" />
    <meta name="twitter:description" content="Bold, cinematic storytelling and high-end production services from Cairo & Riyadh." />
    <meta name="twitter:image" content="/src/assets/red-gorilla.png" />
    <meta name="twitter:site" content="@your_twitter" />

    <!-- Favicon & App icons (uses project red-gorilla asset) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/red-gorilla.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/src/assets/red-gorilla.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/red-gorilla.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#1b1b1b" />
    <meta name="msapplication-TileImage" content="/src/assets/red-gorilla.png" />

    <!-- Preconnect and fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />

    <!-- JSON-LD structured data (Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gorilla",
        "url": "https://your-domain.com/",
        "logo": "https://your-domain.com/src/assets/red-gorilla.png",
        "sameAs": [
          "https://www.youtube.com/",
          "https://vimeo.com/",
          "https://instagram.com/",
          "https://tiktok.com/"
        ],
        "description": "Gorilla is a creative production company based in Cairo and Riyadh, delivering bold cinematic storytelling and high-end production services across the Middle East."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
